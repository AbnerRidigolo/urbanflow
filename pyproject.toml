[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow"
version = "0.1.0"
description = "Engenharia de dados e simulação histórica de mobilidade urbana"
requires-python = ">=3.11,<3.13"

[project.scripts]
urbanflow = "urbanflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requer Spark e PostgreSQL locais"]
